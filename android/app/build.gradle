plugins { id 'com.android.application' }

android {
    namespace 'org.krakaur.sendero'
    compileSdk 36
    defaultConfig {
        applicationId 'org.krakaur.sendero'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('SENDERO_KEYSTORE')) {
                storeFile file(System.getenv('SENDERO_KEYSTORE'))
                storePassword System.getenv('SENDERO_STORE_PASSWORD')
                keyAlias 'sendero'
                keyPassword System.getenv('SENDERO_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main.assets.srcDirs = ['../../web'] }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
