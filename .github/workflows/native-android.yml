name: Native Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile, test, lint and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.SENDERO_KEYSTORE_BASE64 }}
          SENDERO_STORE_PASSWORD: ${{ secrets.SENDERO_STORE_PASSWORD }}
        run: |
          export SENDERO_KEYSTORE="$RUNNER_TEMP/sendero.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SENDERO_KEYSTORE"
          trap 'rm -f "$SENDERO_KEYSTORE"' EXIT
          gradle -p native-android --no-daemon testDebugUnitTest assembleRelease bundleRelease lintRelease
          mkdir -p native-artifacts
          cp native-android/app/build/outputs/apk/release/app-release.apk native-artifacts/Sendero-Nativo-0.2.0.apk
          cp native-android/app/build/outputs/bundle/release/app-release.aab native-artifacts/Sendero-Nativo-0.2.0.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs native-artifacts/*.apk > native-artifacts/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging native-artifacts/*.apk > native-artifacts/metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions native-artifacts/*.apk > native-artifacts/permissions.txt
          python3 scripts/verify-native.py
          git rev-parse HEAD > native-artifacts/source-commit.txt
          (cd native-artifacts && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-package
          path: |
            native-artifacts/
            native-android/app/build/reports/tests/
            native-android/app/build/reports/lint-results-release.*
  devices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            ram: 1024M
            target: default
          - api: 36
            ram: 2048M
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: ${{ matrix.ram }}
          heap-size: 128M
          disable-animations: true
          script: bash scripts/test-native-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-device-${{ matrix.api }}
          path: |
            native-evidence/
            native-android/app/build/reports/androidTests/
            native-android/app/build/outputs/androidTest-results/
